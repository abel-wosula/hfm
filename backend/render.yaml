services:
  - type: web
    name: studio-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    repo: https://github.com/your-username/your-repo
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: studio-data
      mountPath: /var/www/html/storage
      sizeGB: 1