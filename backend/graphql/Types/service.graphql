type Service {
    id: ID!
    thumbnail: String!
    title: String!
    description: String!
    short_description: String!
    created_at: String!
    updated_at: String!
}

type ServiceMutationResponse {
    message: String!
    service: Service
}

input CreateServiceInput {
    thumbnail: String!
    title: String!
    description: String!
    short_description: String!
}

input UpdateServiceInput {
    thumbnail: String
    title: String
    description: String
    short_description: String
}
input DeleteServiceInput {
    id: ID!
}